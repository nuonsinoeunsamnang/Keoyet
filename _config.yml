# Keoyet Phase-0: Digital Tender Pages
# Jekyll config for GitHub Pages

title: "Keoyet"
description: "Public tender notices and submission information"
baseurl: ""
url: "https://keoyet.com"

# Collections
collections:
  tenders:
    output: true
    permalink: /tenders/:slug/

# Defaults
defaults:
  - scope:
      path: ""
      type: tenders
    values:
      layout: tender

# Vendor bid form (online submission pilot) – shared default; override per tender if needed
vendor_bid_form:
  base_url: "https://tally.so/r/eqB96x"
  # Embed iframe (same form, for /submit-bid/:slug/ pages)
  embed_src: "https://tally.so/embed/eqB96x?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1&formEventsForwarding=1"

# Build
markdown: kramdown
highlighter: rouge
permalink: pretty

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .git
  - .github
  - vendor
  - _templates
