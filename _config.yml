# Keoyet Phase-0: Digital Tender Pages
# Jekyll config for GitHub Pages

title: "Keoyet Tenders"
description: "Public tender notices and submission information"
# Project site at github.io/Keoyet needs baseurl for asset paths. Use "" when using custom domain at root (e.g. tenders.keoyet.com).
baseurl: "/Keoyet"
url: "https://nuonsinoeunsamnang.github.io"

# Collections
collections:
  tenders:
    output: true
    permalink: /tenders/:slug/

# Defaults
defaults:
  - scope:
      path: ""
      type: tenders
    values:
      layout: tender

# Build
markdown: kramdown
highlighter: rouge
permalink: pretty

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .git
  - .github
  - vendor
